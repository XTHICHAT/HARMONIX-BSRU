    <style>
        /* Theme */
        :root { 
            --bg-app: #0F172A; --surface: #1E293B; 
            --primary: #38BDF8; --secondary: #FACC15; --danger: #F43F5E;
            --text-main: #F1F5F9; --text-dim: #94A3B8;
        }
        
        /* Reset & Base */
        * { box-sizing: border-box; }
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: var(--bg-app); 
            margin: 0; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            color: var(--text-main); 
            overflow: hidden; 
            width: 100%; /* Fix overflow */
        }
        
        .bg-fixed { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 50% -20%, #1e293b 0%, #0f172a 60%, #020617 100%); }
        
        #navbar { flex-shrink: 0; height: 60px; padding: 0 15px; display: flex; align-items: center; justify-content: space-between; background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 50; }
        .back-btn { text-decoration: none; font-weight: 700; color: var(--text-dim); display: flex; align-items: center; gap: 5px; font-size: 0.9rem; transition:0.2s; }
        .back-btn:active { transform:scale(0.95); color:white; }
        .page-title { 
            font-family: 'Cinzel', serif; font-size: 1.4rem; color: var(--primary); 
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.6); /* Glowing Effect ตามรูป */
        }

        /* Layout Fixes */
        .container { 
            flex: 1; 
            padding: 15px; /* ลด Padding กันล้น */
            overflow-y: auto; 
            display: flex; flex-direction: column; gap: 25px; 
            max-width: 800px; margin: 0 auto; 
            width: 100%; 
        }
        
        /* Game Grid - Fix Overflow */
        .section-header { font-size: 1.1rem; font-weight: 800; color: white; margin-bottom: 10px; border-left: 4px solid var(--secondary); padding-left: 10px; }
        
        .game-grid { 
            display: grid; 
            grid-template-columns: 1fr; /* มือถือให้เรียงเดี่ยวเลย จะได้ไม่ล้น */
            gap: 15px; 
        }
        /* จอใหญ่ค่อยแบ่ง 2 คอลัมน์ */
        @media (min-width: 600px) {
            .game-grid { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
        }
        
        .game-card { background: linear-gradient(145deg, #1e293b, #0f172a); border: 2px solid #334155; border-radius: 16px; padding: 15px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .game-card:active { transform: scale(0.98); border-color: var(--primary); }
        .game-card::before { content: ''; position: absolute; top:0; left:0; width: 4px; height: 100%; background: var(--primary); }
        .game-icon { width: 55px; height: 55px; background: rgba(56, 189, 248, 0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: var(--primary); border: 1px solid rgba(56, 189, 248, 0.3); flex-shrink: 0; }
        .game-info { flex: 1; min-width: 0; /* Fix flex overflow */ }
        .game-info h3 { margin: 0; font-size: 1.1rem; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .game-info p { margin: 3px 0 0; font-size: 0.8rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .game-play-btn { margin-left: 10px; background: var(--primary); color: #0F172A; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; box-shadow: 0 0 10px rgba(56, 189, 248, 0.5); flex-shrink: 0; }

        .game-card.locked { opacity: 0.6; filter: grayscale(1); cursor: not-allowed; }
        .game-card.locked .game-icon { color: #64748B; background: rgba(255,255,255,0.05); border-color: #334155; }
        .game-card.locked::before { background: #64748B; }

        /* Leaderboard Fixes */
        .lb-container { background: #1E293B; border-radius: 16px; border: 1px solid #334155; overflow: hidden; }
        .lb-row { display: flex; align-items: center; padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .lb-row:last-child { border-bottom: none; }
        
        .lb-rank { width: 25px; font-weight: 800; font-size: 1rem; color: var(--text-dim); text-align: center; flex-shrink: 0; }
        .lb-avatar { width: 35px; height: 35px; border-radius: 50%; margin: 0 10px; border: 2px solid #334155; flex-shrink: 0; }
        
        /* **KEY FIX: min-width: 0 เพื่อให้ text-overflow ทำงานใน flexbox** */
        .lb-name { 
            flex: 1; 
            font-weight: bold; 
            color: white;

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyAj0BepQS_4kLTWmCF8rSzqW44XkgefEG8", authDomain: "harmonix-5c90e.firebaseapp.com", projectId: "harmonix-5c90e", storageBucket: "harmonix-5c90e.firebasestorage.app", messagingSenderId: "659742972654", appId: "1:659742972654:web:f8d532a857da37519db1ff", measurementId: "G-JHVY16ZDHY" };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentUser = null;

    // --- SOUND ---
    const clickSfx = new Audio("https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3");
    const wrongSfx = new Audio("https://assets.mixkit.co/active_storage/sfx/2572/2572-preview.mp3");
    window.playSfx = (type) => { 
        if(type==='click') { clickSfx.currentTime = 0; clickSfx.play().catch(()=>{}); }
        if(type==='wrong') { wrongSfx.currentTime = 0; wrongSfx.play().catch(()=>{}); }
    };

    onAuthStateChanged(auth, (user) => {
        currentUser = user;
        loadLeaderboard();
    });

    async function loadLeaderboard() {
        const list = document.getElementById('lb-list');
        try {
            const q = query(collection(db, "users"), orderBy("rankPoints", "desc"), limit(10));
            const snapshot = await getDocs(q);
            
            list.innerHTML = "";
            let rank = 1;

            snapshot.forEach((doc) => {
                const p = doc.data();
                const isMe = currentUser && currentUser.uid === doc.id;
                
                let rankClass = "";
                let icon = "";
                if(rank === 1) { rankClass = "rank-1"; icon = "👑"; }
                else if(rank === 2) { rankClass = "rank-2"; }
                else if(rank === 3) { rankClass = "rank-3"; }

                const html = `
                    <div class="lb-row ${isMe ? 'my-rank' : ''}">
                        <div class="lb-rank ${rankClass}">${icon || rank}</div>
                        <img src="${p.photoURL || 'https://api.dicebear.com/7.x/fun-emoji/svg?seed=Guest'}" class="lb-avatar">
                        <div class="lb-name">${p.displayName || 'Unknown'} ${isMe ? '(ฉัน)' : ''}</div>
                        <div class="lb-score">${p.rankPoints || 0}</div>
                    </div>
                `;
                list.innerHTML += html;
                rank++;
            });

            if (snapshot.empty) {
                list.innerHTML = '<div class="loader">ยังไม่มีข้อมูลคะแนน</div>';
            }

        } catch (e) {
            console.error(e);
            list.innerHTML = '<div class="loader" style="color:#F43F5E;">โหลดไม่สำเร็จ</div>';
        }
    }
</script>

<script type="module">
    import { getFirestore, collection, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    
    const db = getFirestore();
    const auth = getAuth();
    let currentInvite = null;
    let autoCloseTimer = null;

    onAuthStateChanged(auth, (user) => {
        if(user) {
            onSnapshot(collection(db, `users/${user.uid}/notifications`), (snap) => {
                snap.docChanges().forEach(change => {
                    if (change.type === "added") {
                        const data = change.doc.data();
                        if(data.type === 'invite') {
                            currentInvite = { id: change.doc.id, ...data };
                            showInvite(data);
                        }
                    }
                });
            });
        }
    });

    function showInvite(data) {
        const toast = document.getElementById('invite-toast');
        document.getElementById('inv-msg').innerText = `${data.fromName} ชวนคุณเล่นเกม!`;
        toast.style.display = 'block';
        
        // เล่นเสียงเตือน (ถ้ามีไฟล์เสียง)
        try { new Audio("https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3").play().catch(()=>{}); } catch(e){}

        // **ตั้งเวลา 5 วินาที แล้วปิดเอง**
        if(autoCloseTimer) clearTimeout(autoCloseTimer);
        autoCloseTimer = setTimeout(() => {
            closeInvite();
        }, 5000); 
    }

    window.closeInvite = () => {
        const toast = document.getElementById('invite-toast');
        toast.style.display = 'none';
        // ลบ Invite ออกจาก DB ด้วยเพื่อไม่ให้ค้าง
        if(currentInvite && auth.currentUser) {
             deleteDoc(doc(db, `users/${auth.currentUser.uid}/notifications/${currentInvite.id}`)).catch(()=>{});
        }
    };

    // แก้ไข: ฟังก์ชันรับคำเชิญ ให้เช็คประเภทเกม
    window.acceptInvite = async () => {
        if(currentInvite) {
            // ลบการแจ้งเตือน
            await deleteDoc(doc(db, `users/${auth.currentUser.uid}/notifications/${currentInvite.id}`)).catch(()=>{});
            
            // เช็คว่าเพื่อนชวนเล่นเกมอะไร?
            if (currentInvite.gameType === 'quest') {
                // ถ้าเป็น Quest ไปหน้า quest.html
                window.location.href = `quest.html?room=${currentInvite.roomId}`;
            } else {
                // ถ้าไม่ระบุ หรือเป็น Blitz ไปหน้า multi.html (เกมเดิม)
                window.location.href = `multi.html?mode=join&room=${currentInvite.roomId}`; 
            }
        }
    };
</script>

<script type="module">
    import { getFirestore, doc, updateDoc, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const auth = getAuth();
    const db = getFirestore();
    let globalUser = null;
    let isChatOpen = false;
    let unreadCount = 0;
    
    // ตัวแปรสำหรับ Drag Drop
    let isDragging = false;
    let hasMoved = false;

    // --- 1. SETUP & AUTH ---
    onAuthStateChanged(auth, (user) => {
        if(user) {
            globalUser = user;
            document.getElementById('global-chat-overlay').style.display = 'block';
            
            // โหลดตำแหน่งปุ่มที่เคยเซฟไว้
            loadFabPosition();
            // เริ่มระบบ Drag
            makeDraggable(document.getElementById("gc-fab"));
            
            startGlobalHeartbeat();
            initGlobalChat();
        } else {
            document.getElementById('global-chat-overlay').style.display = 'none';
        }
    });

    // --- 2. DRAG & DROP LOGIC ---
    function makeDraggable(elmnt) {
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

        elmnt.onmousedown = dragMouseDown;
        elmnt.ontouchstart = dragMouseDown; // Support Mobile

        function dragMouseDown(e) {
            // e = e || window.event;
            // e.preventDefault(); // อย่าเพิ่ง preventDefault ตรงนี้ เพื่อให้ยังคลิก input ได้ถ้ามี
            
            // Get initial cursor position
            if(e.type === 'touchstart') {
                pos3 = e.touches[0].clientX;
                pos4 = e.touches[0].clientY;
            } else {
                pos3 = e.clientX;
                pos4 = e.clientY;
            }

            hasMoved = false; // Reset move flag
            
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
            document.ontouchend = closeDragElement;
            document.ontouchmove = elementDrag;
        }

        function elementDrag(e) {
            // e.preventDefault(); // ป้องกัน scroll หน้าจอขณะลากปุ่ม
            if(e.type === 'touchmove') e.preventDefault();

            // Calculate new cursor position
            let clientX, clientY;
            if(e.type === 'touchmove') {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            pos1 = pos3 - clientX;
            pos2 = pos4 - clientY;
            pos3 = clientX;
            pos4 = clientY;

            // ตรวจสอบว่าขยับจริงไหม (กันมือสั่นเวลากดคลิกเฉยๆ)
            if(Math.abs(pos1) > 0 || Math.abs(pos2) > 0) {
                isDragging = true;
                hasMoved = true;
            }

            // Set element new position
            let newTop = (elmnt.offsetTop - pos2);
            let newLeft = (elmnt.offsetLeft - pos1);
            
            // Boundary Check (กันปุ่มตกขอบจอ)
            const winWidth = window.innerWidth;
            const winHeight = window.innerHeight;
            if(newTop < 0) newTop = 0;
            if(newLeft < 0) newLeft = 0;
            if(newTop + elmnt.offsetHeight > winHeight) newTop = winHeight - elmnt.offsetHeight;
            if(newLeft + elmnt.offsetWidth > winWidth) newLeft = winWidth - elmnt.offsetWidth;

            elmnt.style.top = newTop + "px";
            elmnt.style.left = newLeft + "px";
            elmnt.style.bottom = "auto"; // ยกเลิก bottom เดิม
            elmnt.style.right = "auto";  // ยกเลิก right เดิม
        }

        function closeDragElement() {
            // Stop moving
            document.onmouseup = null;
            document.onmousemove = null;
            document.ontouchend = null;
            document.ontouchmove = null;

            if(hasMoved) {
                // ถ้ามีการลากเกิดขึ้น ให้บันทึกตำแหน่งล่าสุดลง LocalStorage
                saveFabPosition(elmnt.style.top, elmnt.style.left);
                // ตั้ง Delay นิดนึงเพื่อให้ click handler รู้ว่านี่คือการลาก ไม่ใช่คลิก
                setTimeout(() => { isDragging = false; }, 100); 
            } else {
                isDragging = false;
            }
        }
    }

    // ฟังก์ชันแยกคลิกธรรมดา vs ลาก
    window.handleFabClick = () => {
        if(!isDragging && !hasMoved) {
            toggleGlobalChat();
        }
    };

    function saveFabPosition(top, left) {
        localStorage.setItem('chat_fab_pos', JSON.stringify({ top, left }));
    }

    function loadFabPosition() {
        const saved = localStorage.getItem('chat_fab_pos');
        if(saved) {
            try {
                const pos = JSON.parse(saved);
                const fab = document.getElementById('gc-fab');
                fab.style.top = pos.top;
                fab.style.left = pos.left;
                fab.style.bottom = 'auto';
                fab.style.right = 'auto';
            } catch(e) {}
        }
    }

    // --- 3. HEARTBEAT ---
    function startGlobalHeartbeat() {
        updateStatus();
        setInterval(updateStatus, 60000);
    }
    async function updateStatus() {
        if(!globalUser) return;
        try { await updateDoc(doc(db, "users", globalUser.uid), { lastSeen: Date.now() }); } catch(e){}
    }

    // --- 4. CHAT SYSTEM ---
    window.toggleGlobalChat = () => {
        const win = document.getElementById('gc-window');
        // ปรับตำแหน่งหน้าต่าง Chat ให้สัมพันธ์กับปุ่ม (ถ้าอยู่ซ้าย หน้าต่างก็ควรชิดซ้าย)
        const fab = document.getElementById('gc-fab');
        const fabRect = fab.getBoundingClientRect();
        
        // Logic ง่ายๆ: ถ้าปุ่มอยู่ครึ่งขวาของจอ ให้หน้าต่างอยู่ขวา, ถ้าอยู่ซ้าย ให้หน้าต่างอยู่ซ้าย
        if(fabRect.left > window.innerWidth / 2) {
             win.style.right = '20px'; win.style.left = 'auto';
        } else {
             win.style.left = '20px'; win.style.right = 'auto';
        }

        isChatOpen = !isChatOpen;
        if(isChatOpen) {
            win.style.display = 'flex';
            unreadCount = 0;
            updateBadge();
            scrollToBottom();
            document.getElementById('gc-input').focus();
        } else {
            win.style.display = 'none';
        }
    };

    function updateBadge() {
        const b = document.getElementById('gc-badge');
        b.style.display = unreadCount > 0 ? 'block' : 'none';
        b.innerText = unreadCount;
    }

    function initGlobalChat() {
        const q = query(collection(db, "global_chat"), orderBy("timestamp", "desc"), limit(30));
        onSnapshot(q, (snapshot) => {
            const msgs = [];
            snapshot.forEach(doc => msgs.push({id: doc.id, ...doc.data()}));
            msgs.reverse(); 
            renderMessages(msgs);
            if(!isChatOpen && snapshot.docChanges().length > 0) {
                const lastMsg = msgs[msgs.length - 1];
                if(lastMsg && lastMsg.uid !== globalUser.uid) {
                    if(snapshot.docChanges().length === 1 && snapshot.docChanges()[0].type === 'added') {
                         unreadCount++;
                         updateBadge();
                         playNotificationSound();
                    }
                }
            }
        });
    }

    function renderMessages(msgs) {
        const container = document.getElementById('gc-messages');
        container.innerHTML = '<div style="text-align:center; color:#64748B; font-size:0.8rem; margin-top:10px; margin-bottom:10px;">--- เริ่มต้นบทสนทนา ---</div>';
        msgs.forEach(m => {
            const isMine = m.uid === globalUser.uid;
            const div = document.createElement('div');
            div.className = `msg-row ${isMine ? 'mine' : ''}`;
            div.innerHTML = `<img src="${m.avatar}" class="msg-avatar" title="${m.name}"><div>${!isMine ? `<div class="msg-name">${m.name}</div>` : ''}<div class="msg-bubble">${escapeHtml(m.text)}</div></div>`;
            container.appendChild(div);
        });
        if(isChatOpen) scrollToBottom();
    }

    window.sendGlobalMessage = async () => {
        const input = document.getElementById('gc-input');
        const text = input.value.trim();
        if(!text || !globalUser) return;
        input.value = ''; 
        try {
            await addDoc(collection(db, "global_chat"), {
                uid: globalUser.uid, name: globalUser.displayName, avatar: globalUser.photoURL, text: text, timestamp: serverTimestamp()
            });
            scrollToBottom();
        } catch(e) { alert("ส่งไม่สำเร็จ"); }
    };

    window.handleChatEnter = (e) => { if(e.key === 'Enter') sendGlobalMessage(); };
    function scrollToBottom() { const c = document.getElementById('gc-messages'); c.scrollTop = c.scrollHeight; }
    function escapeHtml(text) { if(!text) return ""; return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function playNotificationSound() { try { const audio = new Audio("https://assets.mixkit.co/active_storage/sfx/2346/2346-preview.mp3"); audio.volume = 0.3; audio.play().catch(()=>{}); } catch(e){} }
</script>
