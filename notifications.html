<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Harmonix - Notifications</title>
    
    <link rel="icon" type="image/png" href="favicon.PNG">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================
           ✨ HARMONIX - MINIMAL FUTURISTIC THEME
           ========================================= */
        :root { 
            --bg-dark: #05050A;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #00E5FF; 
            --secondary: #B066FE; 
            --accent: #FF007A; 
            --gold: #FACC15;
            --danger: #FF3366;
            --success: #10B981;
            --text-main: #FFFFFF; 
            --text-dim: #8A8A93; 
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Montserrat', 'Sarabun', sans-serif; 
            background-color: var(--bg-dark); 
            min-height: 100dvh; 
            overflow-x: hidden; 
            display: flex; 
            flex-direction: column; 
            color: var(--text-main); 
        }

        .ambient-bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg-dark); }
        .orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.4; animation: float 12s infinite alternate ease-in-out; }
        .orb.cyan { top: -10%; left: -10%; width: 50vw; height: 50vw; background: var(--primary); }
        .orb.purple { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: var(--secondary); animation-delay: -5s; }
        .orb.pink { top: 40%; left: 30%; width: 30vw; height: 30vw; background: var(--accent); animation-duration: 15s; opacity: 0.2; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, 50px) scale(1.1); } }

        /* Navigation */
        .mobile-only { display: flex; } .desktop-only { display: none; }
        .mobile-header { position: fixed; top: 0; width: 100%; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; background: rgba(5, 5, 10, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); }
        .logo-text { font-size: 1.2rem; font-weight: 900; letter-spacing: 4px; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; color: transparent; text-transform: uppercase; }
        .btn-icon-glass { width: 45px; height: 45px; border-radius: 14px; background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); color: var(--text-main); display: flex; justify-content: center; align-items: center; font-size: 1.2rem; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden; }
        .btn-icon-glass.active-nav { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 15px rgba(0, 229, 255, 0.3); }
        .btn-icon-glass:active { transform: scale(0.9); }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; display: none; }
        .mobile-bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 70px; background: rgba(10, 10, 15, 0.7); backdrop-filter: blur(30px); border: 1px solid var(--glass-border); border-radius: 24px; display: flex; justify-content: space-around; align-items: center; z-index: 100; padding: 0 10px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); text-decoration: none; font-size: 0.65rem; font-weight: 700; gap: 4px; transition: 0.3s; width: 60px; height: 100%; cursor: pointer; }
        .nav-item i { font-size: 1.4rem; transition: 0.3s; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: translateY(-4px); filter: drop-shadow(0 0 10px var(--primary)); }

        @media (min-width: 1024px) {
            .mobile-only { display: none !important; } .desktop-only { display: flex !important; }
            .desktop-nav { position: fixed; top: 0; width: 100%; padding: 25px 50px; display: flex; justify-content: space-between; align-items: center; z-index: 100; background: rgba(5, 5, 10, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); }
            .nav-links { display: flex; gap: 40px; background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); padding: 12px 35px; border-radius: 100px; }
            .nav-links a { color: var(--text-dim); text-decoration: none; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; transition: 0.3s; letter-spacing: 1px; }
            .nav-links a:hover, .nav-links a.active { color: var(--primary); text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); }
        }

        /* 📋 NOTIFICATIONS CONTENT */
        .app-content { flex: 1; display: flex; flex-direction: column; padding: 100px 20px 120px 20px; width: 100%; max-width: 800px; margin: 0 auto; animation: fadeUp 0.5s ease-out forwards; position: relative; z-index: 10; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .section-title { color: white; font-family: 'Montserrat'; font-weight: 900; font-size: 1.4rem; letter-spacing: 2px; display: flex; align-items: center; gap: 12px; margin: 0; }
        .mark-read-btn { background: transparent; border: 1px solid var(--glass-border); color: var(--text-dim); padding: 8px 16px; border-radius: 12px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: 0.2s; font-family: 'Sarabun'; display: flex; align-items: center; gap: 6px; }
        .mark-read-btn:hover, .mark-read-btn:active { background: rgba(255,255,255,0.05); color: white; }

        .notif-list { display: flex; flex-direction: column; gap: 15px; }
        
        .notif-card { 
            background: rgba(15, 15, 20, 0.5); 
            backdrop-filter: blur(20px); 
            border: 1px solid var(--glass-border); 
            border-radius: 24px; 
            padding: 20px; 
            display: flex; gap: 18px; align-items: flex-start; 
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .notif-card:hover { transform: translateY(-3px); background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.15); }
        .notif-card.unread { background: rgba(0, 229, 255, 0.05); border-color: rgba(0, 229, 255, 0.3); box-shadow: 0 0 20px rgba(0, 229, 255, 0.1), inset 0 0 15px rgba(0, 229, 255, 0.05); }
        
        .notif-icon { width: 55px; height: 55px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; box-shadow: inset 0 0 15px rgba(255,255,255,0.05); }
        .icon-system { background: rgba(0, 229, 255, 0.1); color: var(--primary); border: 1px solid rgba(0, 229, 255, 0.3); }
        .icon-reward { background: rgba(250, 204, 21, 0.1); color: var(--gold); border: 1px solid rgba(250, 204, 21, 0.3); }
        .icon-class { background: rgba(176, 102, 254, 0.1); color: var(--secondary); border: 1px solid rgba(176, 102, 254, 0.3); }
        
        .notif-content { flex: 1; }
        .notif-title { font-weight: 800; color: white; margin: 0 0 6px 0; font-family: 'Montserrat'; font-size: 1.05rem; letter-spacing: 0.5px; }
        .notif-desc { font-size: 0.9rem; color: var(--text-dim); line-height: 1.5; font-family: 'Sarabun'; margin: 0; }
        .notif-time { font-size: 0.75rem; color: #52525B; margin-top: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        
        .unread-dot { width: 10px; height: 10px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 10px var(--primary); margin-bottom: 5px; }
        
        /* ปุ่มลบข้อความ */
        .btn-del-notif { background: transparent; border: none; color: rgba(255,255,255,0.2); cursor: pointer; padding: 8px; font-size: 1.1rem; border-radius: 12px; transition: 0.2s; }
        .btn-del-notif:hover { color: var(--danger); background: rgba(255, 51, 102, 0.1); }
        .btn-del-notif:active { transform: scale(0.9); }

        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-dim); }
        .empty-state i { font-size: 4rem; color: rgba(255,255,255,0.05); margin-bottom: 20px; }
        .empty-state h3 { font-family: 'Montserrat'; color: white; margin-bottom: 5px; }

    </style>
</head>
<body>

    <div class="ambient-bg">
        <div class="orb cyan"></div><div class="orb purple"></div><div class="orb pink"></div>
    </div>

    <nav class="desktop-only desktop-nav">
        <div class="logo-text">HARMONIX</div>
        <div class="nav-links">
            <a href="studio.html">Studio</a>
            <a href="dashboard.html">Games</a>
            <a href="index.html">Join</a>
            <a href="harmony-pro.html">Create</a>
            <a href="teacher.html">Class</a>
        </div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <button class="btn-icon-glass active-nav" onclick="window.location.reload()"><i class="fa-solid fa-bell"></i></button>
            <button class="btn-icon-glass" onclick="window.location.href='profile.html'">
                <img src="" id="nav-avatar-desktop" class="avatar-img">
                <i class="fa-regular fa-user" id="nav-icon-desktop"></i>
            </button>
        </div>
    </nav>

    <header class="mobile-only mobile-header">
        <div class="logo-text">INBOX</div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-icon-glass active-nav" onclick="window.location.reload()"><i class="fa-solid fa-bell"></i></button>
            <button class="btn-icon-glass" onclick="window.location.href='profile.html'">
                <img src="" id="nav-avatar-mobile" class="avatar-img">
                <i class="fa-regular fa-user" id="nav-icon-mobile"></i>
            </button>
        </div>
    </header>

    <main class="app-content">
        
        <div class="header-row">
            <h1 class="section-title"><i class="fa-regular fa-bell"></i> NOTIFICATIONS</h1>
            <div style="display: flex; gap: 10px;">
                <button class="mark-read-btn" onclick="markAllAsRead()"><i class="fa-solid fa-check-double"></i> อ่านทั้งหมด</button>
                <button class="mark-read-btn" onclick="deleteAllNotifs()" style="color:var(--danger); border-color:rgba(255,51,102,0.3);"><i class="fa-solid fa-trash-can"></i> ล้างทั้งหมด</button>
            </div>
        </div>

        <div class="notif-list" id="notifications-container">
            <div style="text-align:center; padding: 40px; color:var(--primary);"><i class="fa-solid fa-spinner fa-spin fa-2x"></i></div>
        </div>

    </main>

    <nav class="mobile-only mobile-bottom-nav">
        <a href="studio.html" class="nav-item"><i class="fa-solid fa-sliders"></i></a>
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-gamepad"></i></a>
        <a href="index.html" class="nav-item">
            <div style="background: var(--glass-bg); border: 1px solid var(--glass-border); width: 45px; height: 45px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: white; transform: translateY(-10px); box-shadow: 0 10px 20px rgba(0,0,0,0.4);">
                <i class="fa-solid fa-bolt" style="font-size: 1.2rem;"></i>
            </div>
        </a>
        <a href="harmony-pro.html" class="nav-item"><i class="fa-solid fa-plus"></i></a>
        <a href="teacher.html" class="nav-item"><i class="fa-solid fa-users"></i></a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAj0BepQS_4kLTWmCF8rSzqW44XkgefEG8", authDomain: "harmonix-5c90e.firebaseapp.com", projectId: "harmonix-5c90e", storageBucket: "harmonix-5c90e.firebasestorage.app", messagingSenderId: "659742972654", appId: "1:659742972654:web:f8d532a857da37519db1ff" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const photo = user.photoURL || `https://api.dicebear.com/7.x/fun-emoji/svg?seed=${user.displayName}`;
                const navAvaM = document.getElementById('nav-avatar-mobile'); 
                const navAvaD = document.getElementById('nav-avatar-desktop'); 
                if(navAvaM) { navAvaM.src = photo; navAvaM.style.display = 'block'; }
                if(navAvaD) { navAvaD.src = photo; navAvaD.style.display = 'block'; }

                listenToNotifications();
            } else { 
                window.location.href = 'profile.html';
            }
        });

        function listenToNotifications() {
            const container = document.getElementById('notifications-container');
            const q = query(collection(db, "notifications"), orderBy("createdAt", "desc"), limit(30));
            
            onSnapshot(q, (snap) => {
                container.innerHTML = '';
                
                let readMsgs = JSON.parse(localStorage.getItem(`read_notifs_${currentUser.uid}`) || "[]");
                let delMsgs = JSON.parse(localStorage.getItem(`deleted_notifs_${currentUser.uid}`) || "[]");
                let hasVisibleMsgs = false;

                snap.forEach(doc => {
                    const notifId = doc.id;
                    if(delMsgs.includes(notifId)) return; // ข้ามข้อความที่ถูกลบไปแล้ว
                    
                    hasVisibleMsgs = true;
                    const n = doc.data();
                    const isUnread = !readMsgs.includes(notifId);

                    const iconClass = n.type === 'system' ? 'icon-system' : n.type === 'reward' ? 'icon-reward' : 'icon-class';
                    const unreadClass = isUnread ? 'unread' : '';
                    const dot = isUnread ? '<div class="unread-dot"></div>' : '';
                    
                    let timeStr = "Just now";
                    if (n.createdAt) {
                        const dateObj = new Date(n.createdAt.toDate());
                        timeStr = dateObj.toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' });
                    }

                    container.innerHTML += `
                        <div class="notif-card ${unreadClass}" id="notif-${notifId}" onclick="readNotification('${notifId}', this)">
                            <div class="notif-icon ${iconClass}"><i class="fa-solid ${n.icon || 'fa-bell'}"></i></div>
                            <div class="notif-content">
                                <h4 class="notif-title">${n.title}</h4>
                                <p class="notif-desc">${n.desc}</p>
                                <div class="notif-time"><i class="fa-regular fa-clock"></i> ${timeStr}</div>
                            </div>
                            <div style="display:flex; flex-direction:column; align-items:flex-end; justify-content:space-between; height:100%;">
                                <button class="btn-del-notif" onclick="deleteNotification('${notifId}', event)" title="ลบข้อความ"><i class="fa-solid fa-trash"></i></button>
                                ${dot}
                            </div>
                        </div>
                    `;
                });

                if(!hasVisibleMsgs) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-box-open"></i>
                            <h3>NO NOTIFICATIONS</h3>
                            <p style="font-family:'Sarabun';">คุณยังไม่มีข้อความใหม่ในขณะนี้</p>
                        </div>
                    `;
                }
            });
        }

        window.readNotification = (id, element) => {
            if(element.classList.contains('unread')) {
                element.classList.remove('unread');
                const dot = element.querySelector('.unread-dot');
                if(dot) dot.remove();

                let readMsgs = JSON.parse(localStorage.getItem(`read_notifs_${currentUser.uid}`) || "[]");
                if(!readMsgs.includes(id)) {
                    readMsgs.push(id);
                    localStorage.setItem(`read_notifs_${currentUser.uid}`, JSON.stringify(readMsgs));
                }
            }
        };

        window.markAllAsRead = () => {
            const cards = document.querySelectorAll('.notif-card.unread');
            let readMsgs = JSON.parse(localStorage.getItem(`read_notifs_${currentUser.uid}`) || "[]");
            
            cards.forEach(c => {
                c.classList.remove('unread');
                const dot = c.querySelector('.unread-dot');
                if(dot) dot.remove();
                
                const id = c.id.replace('notif-', '');
                if(!readMsgs.includes(id)) readMsgs.push(id);
            });
            localStorage.setItem(`read_notifs_${currentUser.uid}`, JSON.stringify(readMsgs));
        };

        window.deleteNotification = (id, event) => {
            event.stopPropagation(); // ป้องกันการคลิกทะลุไปกล่องใหญ่ (เพื่อไม่ให้ถูกมาร์คว่าอ่านแล้ว)
            if(confirm("ลบข้อความนี้ใช่หรือไม่?")) {
                let delMsgs = JSON.parse(localStorage.getItem(`deleted_notifs_${currentUser.uid}`) || "[]");
                if(!delMsgs.includes(id)) {
                    delMsgs.push(id);
                    localStorage.setItem(`deleted_notifs_${currentUser.uid}`, JSON.stringify(delMsgs));
                }
                
                const card = document.getElementById(`notif-${id}`);
                if(card) {
                    card.style.transform = "scale(0.9)";
                    card.style.opacity = "0";
                    setTimeout(() => listenToNotifications(), 300); // รีโหลดเพื่อให้แสดงสถานะว่างเปล่า (ถ้าลบอันสุดท้าย)
                }
            }
        };

        window.deleteAllNotifs = () => {
            if(confirm("ยืนยันการล้างข้อความทั้งหมดใช่หรือไม่?")) {
                const cards = document.querySelectorAll('.notif-card');
                let delMsgs = JSON.parse(localStorage.getItem(`deleted_notifs_${currentUser.uid}`) || "[]");
                
                cards.forEach(c => {
                    const id = c.id.replace('notif-', '');
                    if(!delMsgs.includes(id)) delMsgs.push(id);
                });
                
                localStorage.setItem(`deleted_notifs_${currentUser.uid}`, JSON.stringify(delMsgs));
                listenToNotifications();
            }
        };
    </script>
</body>
</html>
