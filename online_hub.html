<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Harmonix - Online World</title>
    
    <script>
        window.addEventListener('error', function(e) { console.error("System Error:", e.message); });
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CORE THEME --- */
        :root { 
            --bg-deep: #020617; 
            --glass-bg: rgba(30, 41, 59, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #38BDF8; --primary-glow: rgba(56, 189, 248, 0.5);
            --gold: #FACC15; --gold-glow: rgba(250, 204, 21, 0.5);
            --danger: #F43F5E;
            --success: #10B981;
            --text-main: #F8FAFC; --text-dim: #94A3B8;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: var(--bg-deep); 
            margin: 0; height: 100dvh; 
            display: flex; flex-direction: column; 
            color: var(--text-main); overflow: hidden; 
        }
        
        .bg-fixed { 
            position: fixed; inset: 0; z-index: -1; 
            background: radial-gradient(circle at 20% 30%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
        }
        .bg-orb {
            position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4;
            animation: floatOrb 10s infinite alternate;
        }
        .orb-1 { width: 300px; height: 300px; background: #4f46e5; top: -50px; left: -50px; }
        .orb-2 { width: 400px; height: 400px; background: #be123c; bottom: -100px; right: -100px; animation-delay: -5s; }
        @keyframes floatOrb { 0% { transform: translate(0, 0); } 100% { transform: translate(30px, 50px); } }

        /* Navbar */
        #navbar { 
            flex-shrink: 0; height: 60px; padding: 0 15px; 
            display: flex; align-items: center; justify-content: space-between; 
            background: rgba(15, 23, 42, 0.8); 
            backdrop-filter: blur(12px); 
            border-bottom: 1px solid var(--glass-border); 
            z-index: 50; 
        }
        .back-btn { 
            text-decoration: none; font-weight: 700; color: var(--text-dim); 
            display: flex; align-items: center; gap: 8px; font-size: 0.9rem; 
            transition: 0.2s; padding: 8px 12px; border-radius: 20px;
            background: rgba(255,255,255,0.05);
        }
        .page-title { 
            font-family: 'Cinzel', serif; font-size: 1.4rem; color: var(--primary); 
            text-shadow: 0 0 15px var(--primary-glow); letter-spacing: 1px;
        }

        /* Layout */
        .container { 
            flex: 1; padding: 20px; overflow-y: auto; 
            max-width: 1200px; margin: 0 auto; width: 100%; 
        }
        .hub-grid { 
            display: grid; grid-template-columns: 1fr; gap: 20px; 
            animation: fadeIn 0.6s ease-out;
        }
        /* Mobile Responsive */
        @media (min-width: 900px) { 
            .hub-grid { grid-template-columns: 1.8fr 1.2fr; align-items: start; } 
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Sections */
        .section-box { 
            background: var(--glass-bg); 
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); 
            border-radius: 24px; padding: 20px; 
            display: flex; flex-direction: column; gap: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .section-header { 
            font-size: 1.1rem; font-weight: 800; color: white; 
            display: flex; align-items: center; gap: 10px;
            padding-bottom: 10px; border-bottom: 1px solid var(--glass-border);
        }
        .section-header i { color: var(--primary); }

        /* Game Cards */
        .game-card { 
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9)); 
            border: 1px solid var(--glass-border); 
            border-radius: 16px; padding: 15px; 
            display: flex; flex-direction: column; gap: 12px; 
            transition: all 0.2s; position: relative; overflow: hidden; 
        }
        .game-card:active { transform: scale(0.98); }
        
        .card-blitz { border-left: 4px solid var(--primary); }
        .card-quest { border-left: 4px solid var(--gold); }

        .gc-top { display: flex; align-items: center; gap: 15px; }
        .game-icon { 
            width: 50px; height: 50px; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 1.5rem; flex-shrink: 0; 
        }
        .card-blitz .game-icon { color: var(--primary); background: rgba(56, 189, 248, 0.1); }
        .card-quest .game-icon { color: var(--gold); background: rgba(250, 204, 21, 0.1); }

        .game-info h3 { margin: 0; font-size: 1.1rem; color: white; font-family: 'Cinzel', serif; }
        .game-info p { margin: 2px 0 0; font-size: 0.85rem; color: var(--text-dim); }
        
        .gc-actions { display: flex; gap: 10px; margin-top: 5px; }
        .btn-action { 
            flex: 1; padding: 10px; border-radius: 10px; border: none; 
            font-weight: 800; cursor: pointer; color: #0F172A; 
            transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; 
            font-size: 0.85rem; 
        }
        .btn-create-blitz { background: var(--primary); }
        .btn-create-quest { background: var(--gold); }
        .btn-join { background: rgba(255,255,255,0.1); color: white; border: 1px solid var(--glass-border); }

        .game-card.locked { opacity: 0.5; filter: grayscale(1); }
        
        /* Friend System */
        .search-box { display: flex; gap: 10px; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 12px; border: 1px solid var(--glass-border); }
        .input-search { 
            flex: 1; background: transparent; border: none; color: white; 
            padding: 8px; outline: none; font-family: 'Sarabun'; width: 100%;
        }
        .btn-search { 
            background: var(--primary); color: #0F172A; border: none; 
            width: 40px; border-radius: 8px; cursor: pointer; 
        }
        
        .tab-bar { display: flex; gap: 15px; border-bottom: 2px solid rgba(255,255,255,0.05); padding-bottom: 5px; margin-bottom: 10px; }
        .tab-btn { 
            background: none; border: none; color: var(--text-dim); 
            font-weight: bold; cursor: pointer; padding: 8px 5px; 
            font-size: 0.9rem; position: relative; transition: 0.3s;
        }
        .tab-btn.active { color: white; border-bottom: 2px solid var(--primary); margin-bottom: -7px; }
        
        .friend-list { display: flex; flex-direction: column; gap: 8px; max-height: 350px; overflow-y: auto; }
        .friend-item { 
            display: flex; align-items: center; gap: 10px; 
            background: rgba(255,255,255,0.03); padding: 10px; 
            border-radius: 10px; 
        }
        .f-avatar { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); }
        .f-info { flex: 1; overflow: hidden; }
        .f-name { font-weight: bold; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .empty-state { text-align: center; color: var(--text-dim); padding: 30px 0; font-style: italic; font-size: 0.9rem; }

        /* Modal & Toast */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 200; visibility: hidden; opacity: 0; transition: 0.3s; }
        .modal-overlay.show { visibility: visible; opacity: 1; }
        .modal-content { 
            background: #1E293B; border: 1px solid var(--glass-border); 
            padding: 25px; border-radius: 20px; width: 85%; max-width: 320px; 
            text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
            transform: scale(0.9); transition: 0.3s; 
        }
        .modal-overlay.show .modal-content { transform: scale(1); }

        #invite-toast { 
            position:fixed; top:20px; right:20px; 
            background: #1E293B; border: 1px solid var(--primary); 
            color:white; padding: 15px; border-radius: 16px; 
            display:none; z-index:9999; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            animation: slideIn 0.5s; width: 90%; max-width: 300px;
        }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Join Modal Specifics */
        .join-title { font-family: 'Cinzel'; font-size: 1.5rem; color: white; margin-bottom: 5px; }
        .join-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid #555; padding: 12px; color: white; font-size: 1.2rem; text-align: center; border-radius: 10px; margin: 15px 0; outline: none; }
        .join-actions { display: flex; gap: 10px; }
    </style>
</head>
<body>
    <div class="bg-fixed">
        <div class="bg-orb orb-1"></div>
        <div class="bg-orb orb-2"></div>
    </div>
    
    <div id="navbar">
        <a href="index.html" class="back-btn" onclick="playSfx('click')"><i class="fa-solid fa-chevron-left"></i> กลับ</a>
        <div class="page-title">ONLINE HUB</div>
        <div style="width: 50px;"></div>
    </div>

    <div class="container">
        <div class="hub-grid">
            
            <div class="section-box">
                <div class="section-header"><span><i class="fa-solid fa-gamepad"></i> เลือกเกม</span></div>
                
                <div class="game-card card-blitz">
                    <div class="gc-top">
                        <div class="game-icon"><i class="fa-solid fa-bolt"></i></div>
                        <div class="game-info">
                            <h3>Harmony Blitz</h3>
                            <p>แข่งความเร็วทฤษฎีดนตรี</p>
                        </div>
                    </div>
                    <div class="gc-actions">
                        <button class="btn-action btn-create-blitz" onclick="playSfx('click'); goToGame('multi.html?mode=host')"><i class="fa-solid fa-plus"></i> สร้าง</button>
                        <button class="btn-action btn-join" onclick="playSfx('click'); openJoinModal('blitz')"><i class="fa-solid fa-right-to-bracket"></i> แจม</button>
                    </div>
                </div>

                <div class="game-card card-quest">
                    <div class="gc-top">
                        <div class="game-icon"><i class="fa-solid fa-shield-halved"></i></div>
                        <div class="game-info">
                            <h3 style="color:var(--gold);">Harmony Quest</h3>
                            <p>RPG Co-op ปราบมอนสเตอร์</p>
                        </div>
                    </div>
                    <div class="gc-actions">
                        <button class="btn-action btn-create-quest" onclick="playSfx('click'); goToGame('quest.html')"><i class="fa-solid fa-dungeon"></i> สร้าง</button>
                        <button class="btn-action btn-join" onclick="playSfx('click'); openJoinModal('quest')"><i class="fa-solid fa-user-plus"></i> แจม</button>
                    </div>
                </div>

                <div class="game-card locked">
                    <div class="gc-top">
                        <div class="game-icon" style="background:rgba(255,255,255,0.05); color:#64748B;"><i class="fa-solid fa-microphone-lines"></i></div>
                        <div class="game-info">
                            <h3 style="color:#64748B;">Pitch Perfect</h3>
                            <p>Coming Soon...</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="section-box">
                <div class="section-header"><span><i class="fa-solid fa-users"></i> สังคม</span></div>
                
                <div class="search-box">
                    <input type="text" id="friend-search" class="input-search" placeholder="ค้นหาเพื่อน...">
                    <button class="btn-search" onclick="playSfx('click'); searchFriend()"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>

                <div class="tab-bar">
                    <button class="tab-btn active" onclick="switchTab('friends')" id="tab-friends">เพื่อน</button>
                    <button class="tab-btn" onclick="switchTab('requests')" id="tab-requests">คำขอ <span class="notif-badge" id="req-badge" style="display:none;">0</span></button>
                </div>

                <div id="list-friends" class="friend-list"><div class="empty-state">กำลังโหลด...</div></div>
                <div id="list-requests" class="friend-list" style="display: none;"><div class="empty-state">ไม่มีคำขอ</div></div>
            </div>

        </div>
    </div>

    <div id="join-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 class="join-title">ENTER CODE</h2>
            <p style="color:#94a3b8; font-size:0.9rem;">กรอกรหัสห้อง 6 หลัก</p>
            <input type="number" id="join-code-input" class="join-input" placeholder="000000" maxlength="6">
            <div class="join-actions">
                <button class="btn-action" style="background:transparent; border:1px solid #555; color:#aaa;" onclick="closeJoinModal()">ยกเลิก</button>
                <button class="btn-action btn-create-blitz" id="btn-confirm-join" onclick="submitJoinCode()">ยืนยัน</button>
            </div>
        </div>
    </div>

    <div id="search-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="color:white; margin-bottom:15px;">ผลการค้นหา</h3>
            <div id="search-result" style="margin-bottom:20px; min-height:50px; display:flex; flex-direction:column; align-items:center; color:#94A3B8;">...</div>
            <button class="btn-action" style="width:100%; background:#334155; color:white;" onclick="document.getElementById('search-modal').classList.remove('show')">ปิด</button>
        </div>
    </div>

    <div id="invite-toast">
        <div style="font-weight:bold; margin-bottom:5px; color:var(--gold);">🎮 คำเชิญเล่นเกม!</div>
        <div id="inv-msg" style="font-size:0.9rem; color:#eee; margin-bottom:10px;">...</div>
        <div style="display:flex; gap:10px;">
            <button onclick="acceptInvite()" class="btn-action" style="background:var(--success); color:white; height:35px;">เข้าร่วม</button>
            <button onclick="closeInvite()" class="btn-action" style="background:transparent; border:1px solid #555; color:#aaa; height:35px;">ไม่สน</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, arrayUnion, collection, query, where, getDocs, onSnapshot, addDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyAj0BepQS_4kLTWmCF8rSzqW44XkgefEG8", authDomain: "harmonix-5c90e.firebaseapp.com", projectId: "harmonix-5c90e", storageBucket: "harmonix-5c90e.firebasestorage.app", messagingSenderId: "659742972654", appId: "1:659742972654:web:f8d532a857da37519db1ff" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentUser = null;
    let currentInvite = null;
    let friendRequests = [];
    let targetGameType = '';

    const clickSfx = new Audio("https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3");
    window.playSfx = (t) => { try { clickSfx.currentTime=0; clickSfx.play().catch(()=>{}); } catch(e){} };
    window.goToGame = (url) => { window.location.href = url; };

    // --- JOIN MODAL LOGIC ---
    window.openJoinModal = (gameType) => {
        targetGameType = gameType;
        document.getElementById('join-modal').classList.add('show');
        document.getElementById('join-code-input').value = '';
        document.getElementById('join-code-input').focus();
        
        const btn = document.getElementById('btn-confirm-join');
        if(gameType === 'quest') {
            btn.style.background = '#FACC15'; btn.style.color = '#422006';
        } else {
            btn.style.background = '#38BDF8'; btn.style.color = '#0F172A';
        }
    };
    window.closeJoinModal = () => document.getElementById('join-modal').classList.remove('show');
    window.submitJoinCode = () => {
        const code = document.getElementById('join-code-input').value.trim();
        if(!code) return;
        playSfx('click');
        if(targetGameType === 'quest') window.location.href = `quest.html?room=${code}`;
        else window.location.href = `multi.html?mode=join&room=${code}`;
    };

    // --- AUTH & MAIN LOGIC ---
    onAuthStateChanged(auth, (user) => {
        if(user) {
            currentUser = user;
            setupNotifications();
            loadFriendsWithStatus();
        } else {
            window.location.href = 'index.html';
        }
    });

    // --- FRIEND LOGIC (Simplified) ---
    async function loadFriendsWithStatus() {
        const listDiv = document.getElementById('list-friends');
        try {
            const uDoc = await getDoc(doc(db, "users", currentUser.uid));
            if(uDoc.exists() && uDoc.data().friends) {
                const friends = uDoc.data().friends; // (Mock status for MVP, real status needs realtime listener)
                listDiv.innerHTML = "";
                friends.forEach(f => {
                    listDiv.innerHTML += `
                    <div class="friend-item">
                        <img src="${f.avatar}" class="f-avatar">
                        <div class="f-info"><div class="f-name">${f.name}</div><div class="status-txt" style="color:#10B981">Online</div></div>
                    </div>`;
                });
            } else { listDiv.innerHTML = '<div class="empty-state">ไม่มีเพื่อน</div>'; }
        } catch(e) { listDiv.innerHTML = '<div class="empty-state">Error</div>'; }
    }

    // --- SEARCH ---
    window.searchFriend = async () => {
        const name = document.getElementById('friend-search').value.trim();
        if(!name) return;
        document.getElementById('search-modal').classList.add('show');
        const resDiv = document.getElementById('search-result');
        resDiv.innerHTML = 'กำลังค้นหา...';
        try {
            const q = query(collection(db, "users"), where("displayName", "==", name));
            const snap = await getDocs(q);
            resDiv.innerHTML = "";
            if(snap.empty) resDiv.innerHTML = "ไม่พบผู้ใช้";
            else {
                snap.forEach(d => {
                    if(d.id === currentUser.uid) return;
                    const u = d.data();
                    const div = document.createElement('div');
                    div.innerHTML = `<img src="${u.photoURL}" style="width:50px; border-radius:50%; margin-bottom:10px;"><div>${u.displayName}</div><button class="btn-action" style="margin-top:10px; background:#38BDF8;">ขอเป็นเพื่อน</button>`;
                    div.querySelector('button').onclick = () => sendReq(d.id, u.displayName);
                    resDiv.appendChild(div);
                });
            }
        } catch(e) { resDiv.innerHTML = "Error"; }
    };
    async function sendReq(uid, name) {
        await addDoc(collection(db, `users/${uid}/notifications`), { type:'friend_request', fromUid:currentUser.uid, fromName:currentUser.displayName, fromAvatar:currentUser.photoURL, timestamp:serverTimestamp() });
        alert("ส่งคำขอแล้ว"); document.getElementById('search-modal').classList.remove('show');
    }

    // --- NOTIFICATIONS & INVITE FIX ---
    function setupNotifications() {
        onSnapshot(collection(db, `users/${currentUser.uid}/notifications`), (snap) => {
            friendRequests = [];
            snap.docs.forEach(d => {
                const data = d.data();
                if(data.type === 'invite') { currentInvite = {id:d.id, ...data}; showInviteToast(data); }
                else if(data.type === 'friend_request') friendRequests.push({id:d.id, ...data});
            });
            const badge = document.getElementById('req-badge');
            badge.style.display = friendRequests.length ? 'block' : 'none';
            badge.innerText = friendRequests.length;
            renderRequests();
        });
    }
    
    function renderRequests() {
        const list = document.getElementById('list-requests');
        list.innerHTML = "";
        if(!friendRequests.length) list.innerHTML = '<div class="empty-state">ไม่มีคำขอ</div>';
        else friendRequests.forEach(r => {
            list.innerHTML += `<div class="friend-item"><img src="${r.fromAvatar}" class="f-avatar"><div class="f-info">${r.fromName}</div><div class="req-actions"><button class="btn-accept" onclick="acceptReq('${r.id}','${r.fromUid}','${r.fromName}','${r.fromAvatar}')">รับ</button></div></div>`;
        });
    }
    
    window.acceptReq = async (rid, uid, name, av) => {
        await updateDoc(doc(db, "users", currentUser.uid), { friends: arrayUnion({uid, name, avatar:av}) });
        await updateDoc(doc(db, "users", uid), { friends: arrayUnion({uid:currentUser.uid, name:currentUser.displayName, avatar:currentUser.photoURL}) });
        await deleteDoc(doc(db, `users/${currentUser.uid}/notifications/${rid}`));
        alert("เป็นเพื่อนแล้ว!");
    };

    function showInviteToast(data) {
        document.getElementById('invite-toast').style.display = 'block';
        document.getElementById('inv-msg').innerText = `${data.fromName} ชวนเล่นเกม!`;
        try{ new Audio("https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3").play().catch(()=>{}); }catch(e){}
    }
    window.closeInvite = () => { document.getElementById('invite-toast').style.display = 'none'; if(currentInvite) deleteDoc(doc(db, `users/${currentUser.uid}/notifications/${currentInvite.id}`)); };
    
    // ** FIX: ACCEPT INVITE REDIRECT **
    window.acceptInvite = async () => {
        if(currentInvite) {
            await deleteDoc(doc(db, `users/${currentUser.uid}/notifications/${currentInvite.id}`));
            // เช็คประเภทเกมแล้วไปให้ถูกที่
            if(currentInvite.gameType === 'quest') window.location.href = `quest.html?room=${currentInvite.roomId}`;
            else window.location.href = `multi.html?mode=join&room=${currentInvite.roomId}`;
        }
    };

    window.switchTab = (t) => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`tab-${t}`).classList.add('active');
        document.getElementById('list-friends').style.display = t==='friends'?'flex':'none';
        document.getElementById('list-requests').style.display = t==='requests'?'flex':'none';
    };
</script>
</body>
</html>
