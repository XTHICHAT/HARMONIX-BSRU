<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Harmonix - Enter The Arena</title>

    <link rel="icon" type="image/png" href="favicon.PNG">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================
           ✨ HARMONIX - MINIMAL FUTURISTIC THEME
           ========================================= */
        :root { 
            --bg-dark: #05050A;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #00E5FF; /* Cyan */
            --secondary: #B066FE; /* Purple */
            --accent: #FF007A; /* Neon Pink */
            --text-main: #FFFFFF; 
            --text-dim: #8A8A93; 
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Montserrat', 'Sarabun', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            height: 100dvh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }

        /* 🌌 Ambient Glow Background */
        .ambient-bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg-dark); }
        .orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.5; animation: float 12s infinite alternate ease-in-out; }
        .orb.cyan { top: -10%; left: -10%; width: 50vw; height: 50vw; background: var(--primary); }
        .orb.purple { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: var(--secondary); animation-delay: -5s; }
        .orb.pink { top: 40%; left: 30%; width: 30vw; height: 30vw; background: var(--accent); animation-duration: 15s; opacity: 0.3; }

        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, 50px) scale(1.1); } }

        /* 📱 MOBILE NAVIGATION */
        .mobile-only { display: flex; } .desktop-only { display: none; }
        
        .mobile-header { position: fixed; top: 0; width: 100%; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .logo-text { font-size: 1.2rem; font-weight: 900; letter-spacing: 4px; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; color: transparent; }
        .btn-icon-glass { width: 45px; height: 45px; border-radius: 14px; background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); color: var(--text-main); display: flex; justify-content: center; align-items: center; font-size: 1.2rem; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden; }
        .btn-icon-glass:active { transform: scale(0.9); border-color: var(--primary); color: var(--primary); }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; display: none; }

        .mobile-bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 70px; background: rgba(10, 10, 15, 0.7); backdrop-filter: blur(30px); border: 1px solid var(--glass-border); border-radius: 24px; display: flex; justify-content: space-around; align-items: center; z-index: 100; padding: 0 10px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); text-decoration: none; font-size: 0.65rem; font-weight: 700; gap: 4px; transition: 0.3s; width: 60px; height: 100%; cursor: pointer; }
        .nav-item i { font-size: 1.4rem; transition: 0.3s; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active i { transform: translateY(-4px); filter: drop-shadow(0 0 10px var(--primary)); }

        /* 🎮 MAIN CONTENT (MOBILE DEFAULT) */
        .app-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; z-index: 10; width: 100%; animation: fadeUp 0.6s ease-out forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* 🔐 PIN ENTRY CARD */
        .pin-wrapper { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; }
        .pin-label { color: var(--text-main); font-size: 1.5rem; font-weight: 900; letter-spacing: 1px; margin-bottom: 25px; text-align: center; font-family: 'Montserrat'; }
        
        .pin-input { width: 100%; padding: 25px 20px; border-radius: 24px; border: 2px solid var(--glass-border); background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(20px); color: var(--text-main); margin-bottom: 20px; outline: none; font-size: 2.5rem; font-weight: 900; text-align: center; font-family: 'Montserrat', sans-serif; letter-spacing: 12px; transition: 0.4s; text-transform: uppercase; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        .pin-input::placeholder { color: rgba(255,255,255,0.1); letter-spacing: 5px; font-size: 2rem; }
        .pin-input:focus { border-color: var(--primary); background: rgba(0, 229, 255, 0.05); box-shadow: 0 0 30px rgba(0, 229, 255, 0.2), inset 0 0 20px rgba(0,0,0,0.5); transform: translateY(-5px); }
        
        .btn-join { width: 100%; padding: 22px; border-radius: 20px; border: none; font-weight: 900; font-size: 1.2rem; cursor: pointer; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #FFF; box-shadow: 0 10px 30px rgba(176, 102, 254, 0.3); transition: 0.3s; font-family: 'Montserrat'; text-transform: uppercase; letter-spacing: 2px; }
        .btn-join:active { transform: translateY(4px) scale(0.98); box-shadow: none; }

        #loader { display: none; color: var(--primary); font-weight: 900; margin-bottom: 20px; font-size: 0.85rem; letter-spacing: 3px; animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; filter: drop-shadow(0 0 5px var(--primary)); } }

        /* 💻 DESKTOP LAYOUT (SPLIT SCREEN) */
        @media (min-width: 1024px) {
            .mobile-only { display: none !important; } .desktop-only { display: flex !important; }
            
            /* Top Navigation Minimal */
            .desktop-nav { position: fixed; top: 0; width: 100%; padding: 25px 50px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
            .nav-links { display: flex; gap: 40px; background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); padding: 12px 35px; border-radius: 100px; }
            .nav-links a { color: var(--text-dim); text-decoration: none; font-weight: 700; font-size: 0.9rem; text-transform: uppercase; transition: 0.3s; letter-spacing: 1px; }
            .nav-links a:hover, .nav-links a.active { color: var(--primary); text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); }
            
            /* Split Content */
            .app-content { flex-direction: row; justify-content: center; gap: 8vw; padding: 0 50px; }
            
            /* Hero Text Left */
            .hero-text { flex: 1; max-width: 500px; display: flex; flex-direction: column; justify-content: center; }
            .hero-badge { display: inline-block; background: rgba(255, 0, 122, 0.1); border: 1px solid var(--accent); color: var(--accent); padding: 6px 16px; border-radius: 100px; font-size: 0.8rem; font-weight: 800; letter-spacing: 1px; margin-bottom: 20px; width: fit-content; }
            .hero-text h1 { font-size: 4.5rem; margin: 0 0 15px 0; line-height: 1.1; font-weight: 900; background: linear-gradient(135deg, #FFF, var(--primary)); -webkit-background-clip: text; color: transparent; }
            .hero-text p { color: var(--text-dim); font-size: 1.15rem; line-height: 1.6; font-family: 'Sarabun'; font-weight: 400; }
            
            /* PIN Right */
            .pin-wrapper { flex: 1; max-width: 450px; background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(30px); border: 1px solid var(--glass-border); padding: 50px; border-radius: 40px; box-shadow: 0 30px 60px rgba(0,0,0,0.4); }
            .pin-label { display: none; } /* Hide label on desktop since Hero text explains it */
            .pin-input { font-size: 3rem; padding: 30px 20px; border-radius: 20px; margin-bottom: 25px; }
            .btn-join { padding: 25px; font-size: 1.3rem; border-radius: 20px; }
            .btn-join:hover { filter: brightness(1.2); transform: translateY(-3px); }
        }

        /* 📋 MODAL (JOIN CLASS) */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(15px); z-index: 200; justify-content: center; align-items: center; flex-direction: column; opacity: 0; transition: opacity 0.3s ease; }
        .modal-overlay.open { display: flex; opacity: 1; }
        .modal-box { background: rgba(15, 15, 20, 0.9); width: 90%; max-width: 420px; padding: 40px; border-radius: 35px; text-align: center; border: 1px solid var(--glass-border); box-shadow: 0 30px 60px rgba(0,0,0,0.6); transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .modal-overlay.open .modal-box { transform: scale(1); }
        
        .modal-box h3 { color: #FFF; font-weight: 900; letter-spacing: 2px; margin-bottom: 25px; }
        .input-field { width: 100%; padding: 20px; border-radius: 16px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.5); color: #fff; margin-bottom: 15px; outline: none; font-size: 1.1rem; font-weight: 500; font-family: 'Sarabun'; transition: 0.3s; text-align: center; }
        .input-field:focus { border-color: var(--primary); background: rgba(0, 229, 255, 0.05); }
        
        .btn-solid { width: 100%; padding: 18px; border-radius: 16px; border: none; font-weight: 900; font-size: 1rem; cursor: pointer; background: var(--primary); color: #000; transition: 0.2s; font-family: 'Montserrat'; letter-spacing: 1px; margin-top: 10px; }
        .btn-solid:active { transform: scale(0.96); }
        .btn-link { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 0.95rem; margin-top: 20px; font-weight: 700; font-family: 'Montserrat'; transition: 0.2s; }
        .btn-link:hover { color: #FFF; }
    </style>
</head>
<body>
    
    <div class="ambient-bg">
        <div class="orb cyan"></div>
        <div class="orb purple"></div>
        <div class="orb pink"></div>
    </div>

    <nav class="desktop-only desktop-nav">
        <div class="logo-text">HARMONIX</div>
        <div class="nav-links">
            <a href="studio.html">Studio</a>
            <a onclick="checkAuthAndGo('dashboard.html')" style="cursor: pointer;">Games</a>
            <a href="index.html" class="active">Join</a>
            <a href="harmony-pro.html">Create</a>
            <a href="teacher.html">Class</a>
        </div>
        <div style="display: flex; gap: 15px;">
            <button class="btn-icon-glass" onclick="window.location.href='notifications.html'"><i class="fa-regular fa-bell"></i></button>
            <button class="btn-icon-glass" onclick="window.location.href='profile.html'">
                <img src="" id="nav-avatar-desktop" class="avatar-img">
                <i class="fa-regular fa-user" id="nav-icon-desktop"></i>
            </button>
        </div>
    </nav>

    <header class="mobile-only mobile-header">
        <div class="logo-text">HARMONIX</div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-icon-glass" onclick="window.location.href='notifications.html'"><i class="fa-regular fa-bell"></i></button>
            <button class="btn-icon-glass" onclick="window.location.href='profile.html'">
                <img src="" id="nav-avatar-mobile" class="avatar-img">
                <i class="fa-regular fa-user" id="nav-icon-mobile"></i>
            </button>
        </div>
    </header>

    <main class="app-content">
        
        <div class="hero-text desktop-only">
            <div class="hero-badge">MUSIC THEORY ARENA</div>
            <h1>Ready to<br>Play?</h1>
            <p>ยินดีต้อนรับสู่ Harmonix สังเวียนดนตรีสำหรับทุกคน กรอกรหัส PIN จากอาจารย์หรือเพื่อนเพื่อเข้าร่วมการแข่งขัน หรือเข้าห้องเรียนได้ทันที!</p>
        </div>

        <div class="pin-wrapper">
            <div class="pin-label mobile-only">ENTER PIN</div>
            <input type="text" id="universal-pin" class="pin-input" placeholder="000000" autocomplete="off" maxlength="8">
            <div id="loader">VERIFYING...</div>
            <button class="btn-join" onclick="processUniversalPin()">JOIN GAME</button>
        </div>

    </main>

    <nav class="mobile-only mobile-bottom-nav">
        <a href="studio.html" class="nav-item"><i class="fa-solid fa-sliders"></i></a>
        <a onclick="checkAuthAndGo('dashboard.html')" class="nav-item"><i class="fa-solid fa-gamepad"></i></a>
        <div class="nav-item active" onclick="document.getElementById('universal-pin').focus()">
            <div style="background: linear-gradient(135deg, var(--primary), var(--secondary)); width: 45px; height: 45px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: white; transform: translateY(-10px); box-shadow: 0 10px 20px rgba(176, 102, 254, 0.4);">
                <i class="fa-solid fa-bolt" style="font-size: 1.2rem;"></i>
            </div>
        </div>
        <a href="harmony-pro.html" class="nav-item"><i class="fa-solid fa-plus"></i></a>
        <a href="teacher.html" class="nav-item"><i class="fa-solid fa-users"></i></a>
    </nav>

    <div class="modal-overlay" id="joinClassModal">
        <div class="modal-box">
            <h3>CLASS REGISTRATION</h3>
            <input type="text" id="jc-name" class="input-field" placeholder="Full Name (ชื่อ-สกุล)">
            <input type="number" id="jc-number" class="input-field" placeholder="No. (เลขที่)">
            <button class="btn-solid" onclick="confirmJoinClass()">CONFIRM</button>
            <button class="btn-link" onclick="closeModal('joinClassModal')">CANCEL</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAj0BepQS_4kLTWmCF8rSzqW44XkgefEG8", authDomain: "harmonix-5c90e.firebaseapp.com", projectId: "harmonix-5c90e", storageBucket: "harmonix-5c90e.firebasestorage.app", messagingSenderId: "659742972654", appId: "1:659742972654:web:f8d532a857da37519db1ff" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
        window.pendingClassPin = "";

        window.checkAuthAndGo = (url) => {
            if(auth.currentUser) { window.location.href = url; }
            else { window.location.href = 'profile.html'; }
        };

        onAuthStateChanged(auth, async (user) => { 
            const navAvaM = document.getElementById('nav-avatar-mobile'); const navIconM = document.getElementById('nav-icon-mobile');
            const navAvaD = document.getElementById('nav-avatar-desktop'); const navIconD = document.getElementById('nav-icon-desktop');
            if(user) { 
                const photo = user.photoURL || `https://api.dicebear.com/7.x/fun-emoji/svg?seed=${user.displayName}`;
                if(navIconM) navIconM.style.display = 'none'; if(navAvaM) { navAvaM.src = photo; navAvaM.style.display = 'block'; }
                if(navIconD) navIconD.style.display = 'none'; if(navAvaD) { navAvaD.src = photo; navAvaD.style.display = 'block'; }
            } else { 
                if(navIconM) navIconM.style.display = 'inline-flex'; if(navAvaM) navAvaM.style.display = 'none'; 
                if(navIconD) navIconD.style.display = 'inline-flex'; if(navAvaD) navAvaD.style.display = 'none'; 
            }
        });

        window.processUniversalPin = async () => {
            const pinInput = document.getElementById('universal-pin'); const pin = pinInput.value.trim().toUpperCase(); const loader = document.getElementById('loader');
            if(!pin) { 
                pinInput.style.borderColor = "var(--accent)"; 
                setTimeout(() => pinInput.style.borderColor = "var(--glass-border)", 1500); 
                return; 
            }
            loader.style.display = 'block';
            try {
                if(pin.startsWith("EX-")) {
                    const examDoc = await getDoc(doc(db, "exams", pin));
                    if(examDoc.exists() && examDoc.data().active) {
                        if(!auth.currentUser || auth.currentUser.isAnonymous) { alert("กรุณาตั้งค่าบัญชีก่อนทำข้อสอบครับ"); window.location.href = 'profile.html'; return; }
                        window.location.href = (examDoc.data().type === "chain-4beat" || examDoc.data().type === "chain") ? `assignment.html?exam=${pin}` : `game.html?exam=${pin}`;
                    } else throw new Error("รหัสไม่ถูกต้อง หรือปิดรับคำตอบแล้ว");
                } else if(pin.length === 6 && !isNaN(pin)) {
                    const roomDoc = await getDoc(doc(db, "rooms", pin));
                    if(roomDoc.exists() && roomDoc.data().status === 'waiting') {
                        if(!auth.currentUser) { alert("กรุณาเข้าสู่ระบบก่อนเข้าห้องนี้"); window.location.href = 'profile.html'; return; }
                        window.location.href = `multi.html?mode=join&room=${pin}`;
                    } else {
                        const classDoc = await getDoc(doc(db, "classes", pin));
                        if(classDoc.exists()) {
                            if(!auth.currentUser || auth.currentUser.isAnonymous) { alert("กรุณาตั้งค่าบัญชีก่อนเข้าห้องเรียน"); window.location.href = 'profile.html'; return; }
                            window.pendingClassPin = pin; document.getElementById('joinClassModal').classList.add('open'); loader.style.display = 'none'; return;
                        } else throw new Error("ไม่พบห้อง หรือเกมกำลังเริ่มไปแล้ว");
                    }
                } else throw new Error("รูปแบบ PIN ไม่ถูกต้อง");
            } catch (err) { if(err.message) alert(err.message); loader.style.display = 'none'; }
        };

        window.confirmJoinClass = async () => {
            const name = document.getElementById('jc-name').value.trim(); const num = document.getElementById('jc-number').value.trim();
            if(!name || !num) return alert("กรุณากรอกข้อมูลให้ครบถ้วน");
            try { 
                await updateDoc(doc(db, "users", auth.currentUser.uid), { classId: window.pendingClassPin, realName: name, studentNo: num }); 
                window.location.href = 'dashboard.html'; 
            } catch(e) { alert(e.message); }
        };
        
        window.closeModal = (id) => document.getElementById(id).classList.remove('open');
    </script>
</body>
</html>
